[project]
name = "bankservice"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # 백엔드
    "fastapi",
    "uvicorn",
    "python-multipart",
    "bcrypt",
    "PyJWT",
    "libsql",
    # 챗봇 / AI 에이전트
    "streamlit",
    "openai",
    "langgraph",
    "langchain-openai",
    "langchain-core",
    "requests",
    "pypdf",
    "ddgs",
    # 선택 인프라 (없어도 동작 — 기능만 degrade)
    "kafka-python",
    "elasticsearch>=8.0.0",
    "redis",
    "chromadb",
]

[tool.vercel]
entrypoint = "backend.app:app"
