# AI은행원(Streamlit Community Cloud)이 절전되지 않게 주기적으로 깨워둔다.
#
# Community Cloud 는 12시간 무트래픽이면 앱을 재운다. 방문하면 자동으로 깨어나지만
# 첫 접속에 30초쯤 걸려서, 채용담당자가 링크를 눌렀을 때 로딩 화면을 먼저 보게 된다.
#
# 주의: 단순 `curl`(HTTP GET)로는 안 된다 — 200 을 받아도 앱은 계속 자고 있다.
# Streamlit 은 websocket 세션이 맺어져야 트래픽으로 인정하므로 실제 브라우저가 필요하다.
# 그래서 Playwright 로 열고 앱이 렌더링을 끝냈는지(가드 안내 문구 출현)까지 확인한다.
name: Keep Streamlit app awake

on:
  schedule:
    - cron: "0 */6 * * *"   # 6시간마다 (절전 기준 12시간의 절반)
  workflow_dispatch:         # 수동 실행도 가능

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: Open the app and confirm it rendered
        env:
          APP_URL: https://bankservice-8zf4k9z6abddnbvhazbhpj.streamlit.app/?embed=true
        run: |
          python - <<'PY'
          import os, sys
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          # DEMO_PUBLIC=1 이라 토큰 없이 열면 이 안내가 뜬다. 이 문구가 보였다는 건
          # 앱이 기동돼 app.py 를 끝까지 실행했다는 뜻이라 "깨어남"의 확실한 증거다.
          MARKER = "매치뱅크 사이트 안에서 이용할 수 있습니다"

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=60_000)
              try:
                  # 자고 있었다면 기동에 시간이 걸리므로 넉넉히 기다린다.
                  page.wait_for_selector(f"text={MARKER}", timeout=180_000)
              except Exception:
                  print("::error::앱이 렌더링되지 않았습니다. 화면 내용 일부:")
                  print(page.content()[:1000])
                  browser.close()
                  sys.exit(1)
              print(f"OK — 앱이 정상 렌더링됨: {url}")
              browser.close()
          PY
