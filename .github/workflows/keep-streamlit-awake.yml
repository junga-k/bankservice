# AI은행원(Streamlit Community Cloud)이 절전되지 않게 주기적으로 깨워둔다.
#
# Community Cloud 무료 티어는 12시간 무트래픽이면 앱을 재운다. 잠들면 방문자에게
# "Zzzz — 깨울까요?" 화면과 버튼이 뜬다(예전처럼 방문만으로 자동 기동되지 않는다).
#
# 이건 보조 장치다. 방문자 경험의 본진은 사이트가 iframe을 붙이기 전에 직접 깨우는
# `POST /api/chat/wake`(backend/app.py)이고, 그쪽은 GitHub에 전혀 의존하지 않는다.
# 여기서 미리 깨워두면 방문자가 그 로딩(~45초)조차 안 보게 된다.
#
# ⚠️ 공개 저장소에서 60일간 활동이 없으면 GitHub이 schedule 트리거를 자동 비활성화한다.
#    (복구: 커밋 1회 또는 Actions 탭의 "Enable workflow". 저장소나 서비스가 죽는 건 아니다.)
#
# 깨우기 절차 — Streamlit Cloud 프런트엔드 번들(states-*.js / schemas-*.js)을 읽어 확인(2026-09-03):
#   1) GET  /api/v2/app/status  → 본문 .status로 상태 판별(AppStatus: RUNNING=5, IS_SHUTDOWN=12)
#                                  + 쿠키(_streamlit_csrf)와 응답 헤더 x-csrf-token을 여기서 함께 받는다
#   2) POST /api/v2/app/resume  → 그 쿠키 + x-csrf-token 헤더 필요. 성공 시 204, 하나라도 빠지면 403.
# 앱 루트(GET /)는 치지 않는다 — 뷰어 인증 리다이렉트 체인이라 느리고 불필요하다.
#
# 예전 이 파일에 있던 "curl로는 안 된다, 브라우저(Playwright)로 중첩 iframe을 봐야 한다"는
# 주석은 더 이상 유효하지 않다. 그건 앱 *화면*을 확인하려 할 때 얘기고, 깨우는 것 자체는
# 위 두 번의 HTTP 요청이 전부다. 그래서 Playwright 의존을 걷어냈다(실행시간 5분+ → 수 초).
name: Keep Streamlit app awake

on:
  schedule:
    - cron: "0 */4 * * *"   # 4시간마다 (절전 기준 12시간 대비 3배 여유 — 스케줄 지연 대비)
  workflow_dispatch:         # 수동 실행도 가능

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the app if it is asleep
        env:
          APP_URL: https://bankservice-8zf4k9z6abddnbvhazbhpj.streamlit.app
        run: |
          set -euo pipefail
          APP="${APP_URL%/}"
          CJ="$(mktemp)"      # 쿠키 자
          HDR="$(mktemp)"     # 응답 헤더(여기서 x-csrf-token을 꺼낸다)

          fetch_status() {
            BODY="$(curl -sS -b "$CJ" -c "$CJ" -D "$HDR" "$APP/api/v2/app/status")"
            STATUS="$(printf '%s' "$BODY" | jq -r '.status // -1')"
            CSRF="$(grep -i '^x-csrf-token:' "$HDR" | tail -1 | sed 's/^[^:]*: *//' | tr -d '\r')"
          }

          fetch_status        # 쿠키·CSRF도 이 호출에서 함께 받는다
          echo "현재 상태: status=$STATUS"

          if [ "$STATUS" = "5" ]; then
            echo "이미 깨어 있음 — 할 일 없음."
            exit 0
          fi

          echo "잠들어 있음. 깨우는 중..."
          CODE="$(curl -sS -X POST -b "$CJ" -c "$CJ" \
                    -H "x-csrf-token: $CSRF" \
                    -o /dev/null -w '%{http_code}' "$APP/api/v2/app/resume")"
          echo "resume 응답: HTTP $CODE"

          for i in $(seq 1 9); do          # 10초 × 9 = 최대 90초 (실측 기동 ~45초)
            sleep 10
            fetch_status
            echo "  [${i}] status=$STATUS"
            if [ "$STATUS" = "5" ]; then
              echo "OK — 앱이 깨어났습니다: $APP"
              exit 0
            fi
          done

          echo "::error::90초 안에 RUNNING(5)이 되지 않았습니다. 마지막 응답: $BODY"
          exit 1
